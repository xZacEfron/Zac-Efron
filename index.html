<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑹𝒖 Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo GIF Dinámico */
    #bg-gif-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      overflow: hidden;
    }

    #bg-gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.45) contrast(1.1);
      transition: filter 1s ease-in-out;
    }

    body.intro-mode #bg-gif-container img {
      filter: brightness(0.95) contrast(1.15);
    }

    /* Fondo de Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 2;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      position: relative;
    }

    /* Clase para ocultar las tarjetas */
    .app-container.hidden-intro,
    .app-container.hidden-manual {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    /* Tarjetas principales */
    .card {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 340px;
      height: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.9);
      transform: translateY(-2px);
    }

    /* Botón X discreto integrado en la esquina superior izquierda del primer cuadro */
    .close-card-btn {
      position: absolute;
      top: 14px;
      left: 16px;
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    body.is-playing .close-card-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .close-card-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: scale(1.1);
    }

    /* Botón para REVELAR la interfaz cuando está oculta */
    .show-ui-trigger {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 99;
      background: rgba(10, 10, 12, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    body.ui-hidden .show-ui-trigger {
      opacity: 1;
      pointer-events: auto;
    }

    .show-ui-trigger:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    /* Título "𝑹𝒖" estilizado */
    .header-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-align: center;
      color: #ffffff;
    }

    /* --- TARJETA VOLTEABLE (FLIP CARD) --- */
    .flip-card-container {
      width: 100%;
      flex: 1;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      border-radius: 20px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card-container.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flip-front::after, .flip-back::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transform: skewX(-25deg);
      transition: left 0.75s ease;
    }

    .flip-card-container:hover .flip-front::after,
    .flip-card-container:hover .flip-back::after {
      left: 150%;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    .full-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .full-img-container img {
        object-fit: contain;
      }
    }

    /* --- TARJETA 2: Playlist con diseño renovado --- */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .playlist-title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .playlist-count {
      font-size: 11px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.05);
      padding: 3px 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
    }

    .song-list::-webkit-scrollbar {
      width: 5px;
    }
    .song-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 10px;
    }
    .song-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      position: relative;
      transition: background 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.03);
      transform: translateX(4px);
    }

    .song-item.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .song-item.playing {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
    }

    .song-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .song-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Ecualizador Animado */
    .equalizer {
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      padding-right: 4px;
    }

    .song-item.active .equalizer {
      display: flex;
    }

    .eq-bar {
      width: 3px;
      background-color: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s ease, background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .song-item.playing .eq-bar {
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    @keyframes eqBounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    /* --- TARJETA 3: Reproductor Lateral Centrado y Equilibrado --- */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: space-between; /* Distribuye uniformemente el espacio */
      position: relative;
      padding-top: 20px;
      padding-bottom: 20px;
    }

    .player-flip-container {
      width: 100%;
      flex: 1;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-flip-container.flipped .player-flip-inner {
      transform: rotateY(180deg);
    }

    .player-front-side, .player-back-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .player-back-side {
      transform: rotateY(180deg);
      background: rgba(15, 15, 18, 0.95);
      border-radius: 16px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      justify-content: flex-start;
    }

    .lyrics-title {
      font-size: 13px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .lyrics-box {
      width: 100%;
      height: 290px; /* Letra larga ocupando todo el alto disponible */
      overflow-y: auto;
      font-size: 13.5px;
      line-height: 1.6;
      color: #e2e8f0;
      padding-right: 6px;
      text-align: center;
      white-space: pre-line;
    }

    .lyrics-box::-webkit-scrollbar {
      width: 4px;
    }
    .lyrics-box::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .disc-container {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      border: 4px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }

    .player-card:hover .disc-container {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rotating {
      animation: spinDisc 12s linear infinite;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .current-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .current-artist {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 0px;
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s, transform 0.2s;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }

    .volume-slider {
      width: 70px;
      accent-color: #ffffff;
      cursor: pointer;
    }

    /* Barra de audio */
    audio {
      width: 100%;
      margin-top: 0px; 
      border-radius: 12px;
      filter: invert(0.9) hue-rotate(180deg);
      transition: box-shadow 0.2s ease;
      border: 1px solid transparent;
    }

    audio::-webkit-media-controls-mute-button {
      filter: hue-rotate(140deg) saturate(2);
    }
  </style>
</head>
<body>

  <!-- Botón limpio para mostrar las tarjetas -->
  <button class="show-ui-trigger" onclick="showUI()">Mostrar Tarjetas</button>

  <!-- Fondo GIF Dinámico -->
  <div id="bg-gif-container">
    <img id="bg-gif-img" src="https://i.postimg.cc/Dw7QrCgK/3e6e0c0d7728ecb249950b8cf3cdccb3.gif" alt="Fondo Animado">
  </div>

  <!-- Canvas para Partículas y Estrellas Neón -->
  <canvas id="particles-canvas"></canvas>

  <div class="app-container" id="app-container">
    
    <!-- Tarjeta 1: 𝑹𝒖 + Foto Volteable -->
    <div class="card">
      <div class="close-card-btn" onclick="hideUI()" title="Ocultar interfaz">✕</div>

      <div class="header-title">𝑹𝒖</div>
      <div class="flip-card-container" id="flip-card" onclick="toggleCardFlip()">
        <div class="flip-card-inner">
          <div class="flip-front full-img-container">
            <img src="https://xatimg.com/image/6psP1KrS59m9.jpg" alt="Ru Photo 1">
          </div>
          <div class="flip-back full-img-container">
            <img src="https://xatimg.com/image/Jg23jlU0z2hq.png" alt="Ru Photo 2">
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 2: Playlist con diseño mejorado -->
    <div class="card">
      <div class="playlist-header">
        <span class="playlist-title">🎵 Playlist</span>
        <span class="playlist-count">22 canciones</span>
      </div>
      <div class="song-list" id="song-list-container">
        <!-- Canciones cargadas por script -->
      </div>
    </div>

    <!-- Tarjeta 3: Reproductor con distribución equilibrada y letras completas -->
    <div class="card player-card">
      
      <div class="player-flip-container" id="player-flip" onclick="togglePlayerFlip(event)">
        <div class="player-flip-inner">
          
          <!-- Lado Frontal: Disco y textos centrados -->
          <div class="player-front-side">
            <div class="disc-container" id="disc-wrapper">
              <img id="player-cover" src="https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg" alt="Kids">
            </div>
            <div class="current-title" id="player-title">Kids</div>
            <div class="current-artist" id="player-artist">MGMT</div>
          </div>

          <!-- Lado Trasero: Letra Completa y Extendida -->
          <div class="player-back-side">
            <div class="lyrics-title" id="lyrics-song-title">Letra</div>
            <div class="lyrics-box" id="lyrics-content">Cargando letra...</div>
          </div>

        </div>
      </div>

      <!-- Controles adicionales -->
      <div class="player-controls-row">
        <button class="control-btn" onclick="prevSong()" title="Anterior">⏮</button>
        <div class="volume-container">
          <span>🔊</span>
          <input type="range" min="0" max="1" step="0.05" value="1" class="volume-slider" oninput="changeVolume(this.value)" title="Volumen">
        </div>
        <button class="control-btn" onclick="nextSong()" title="Siguiente">⏭</button>
      </div>

      <audio id="main-audio" controls controlsList="nodownload" crossorigin="anonymous" src="MGMT - Kids.mp3"></audio>
    </div>

  </div>

  <script>
    function toggleCardFlip() {
      const card = document.getElementById('flip-card');
      card.classList.toggle('flipped');
    }

    function togglePlayerFlip(e) {
      if(e.target.closest('.lyrics-box')) return;
      const playerFlip = document.getElementById('player-flip');
      playerFlip.classList.toggle('flipped');
    }

    function hideUI() {
      const appContainer = document.getElementById('app-container');
      appContainer.classList.add('hidden-manual');
      document.body.classList.add('ui-hidden');
    }

    function showUI() {
      const appContainer = document.getElementById('app-container');
      appContainer.classList.remove('hidden-manual');
      document.body.classList.remove('ui-hidden');
    }

    const playlist = [
      { file: 'MGMT - Kids.mp3', title: 'Kids', artist: 'MGMT', cover: 'https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg', colors: ['#ffee00', '#00f0ff'], lyrics: "Control yourself\nTake only what you need from it\nA family of trees wanting to be haunted\nThe water is warm, but it's sending me shivers\nA baby is born, crying out for attention\n\nMemories assemble in days\nWith 3M tapes and scissor cuts\nThere is an explanation for this\nWith a sentiment insiders you lock in\nThe halls are all taking shape\nWhere are you going? You can't escape\n\nIf you take a look inside my brain\nIt's going insane\n\nMGMT - Kids" },
      { file: 'Men at Work - Down Under.mp3', title: 'Down Under', artist: 'Men at Work', cover: 'https://i.postimg.cc/W39WqBr1/R-1687205-1236953371.jpg', colors: ['#ffee00', '#ff0033'], lyrics: "Travelling in a fried-out combi\nOn a hippie trail, head full of zombie\nI met a strange lady, she made me nervous\nShe took me in and gave me breakfast\nAnd she said\n\n'Do you come from a land down under?\nWhere women glow and men plunder?\nCan't you hear, can't you hear the thunder?\nYou better run, you better take cover'\n\nLying in a den in Bombay\nWith a slack jaw, and not much to say\nI said to the man, 'Are you trying to tempt me?\nBecause I come from the land of plenty?'\nAnd he just smiled\n\nMen at Work - Down Under" },
      { file: 'Kygo - Before You Know It.mp3', title: 'Before You Know It', artist: 'Kygo', cover: 'https://i.postimg.cc/sXFZmG2z/8cc38ce80cb43e99d974f011f7714c19.jpg', colors: ['#ff0033', '#00e5ff'], lyrics: "Looking back at all the times we had\nWe never thought it would end so fast\nStaring at the ceiling in the dark\nTrying to remember your spark\n\nAnd before you know it, we're miles apart\nCarrying the weight inside our hearts\nEvery single memory starts to fade\nLike shadows falling in the shade\n\nKygo - Before You Know It" },
      { file: 'TV on the Radio - Wolf Like Me.mp3', title: 'Wolf Like Me', artist: 'TV on the Radio', cover: 'https://i.postimg.cc/wjH32D9Y/images.jpg', colors: ['#ffee00', '#2a0845'], lyrics: "My mind has been split from a boring bit\nAnd even when I'm close to it\nIt's like I'm miles away\n\nAnd down on the street\nThere's a-runnin' of the feet\nAnd a flash of teeth\nAnd then it's dark again\n\nSolitary, sighing, bleeding, dying\nLow, low, low, low\n\nTV on the Radio - Wolf Like Me" },
      { file: 'Avicii - Fade Into Darkness (Vocal Radio Mix).mp3', title: 'Fade Into Darkness', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg', colors: ['#ffee00', '#00f0ff'], lyrics: "Standing in the shadows of life\nWaiting for a spark to ignite\nNo one can tell you what to do\nWhen the fire inside burns bright\n\nWe could live forever\nWe could fade into darkness\nRunning through the fields of gold\nNever letting go\n\nAvicii - Fade Into Darkness" },
      { file: 'NF - HAPPY.mp3', title: 'HAPPY', artist: 'NF', cover: 'https://i.postimg.cc/vTNTZn56/Nf-Happy.jpg', colors: ['#00f0ff', '#0066ff'], lyrics: "You look at me and see someone who's put together\nI look in the mirror, see a storm and cloudy weather\nI've been dealing with emotions that I can't explain\nTrying to find a way to navigate the pain\n\nAnd honestly, I'm okay with not being happy all the time\nThat's just part of life, yeah, that's just part of my design\n\nNF - HAPPY" },

    ];

    let currentIndex = 0;
    let hasPlayedFirstTime = false;
    const audio = document.getElementById('main-audio');
    const playerCover = document.getElementById('player-cover');
    const discWrapper = document.getElementById('disc-wrapper');
    const songListContainer = document.getElementById('song-list-container');
    const bgGifContainer = document.getElementById('bg-gif-container');
    const bgGifImg = document.getElementById('bg-gif-img');
    const appContainer = document.getElementById('app-container');

    let gifSwitchTimeout = null;

    function renderPlaylist() {
      songListContainer.innerHTML = '';
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
        item.onclick = () => playSongByIndex(index);

        item.innerHTML = `
          <img src="${song.cover}" alt="${song.title}">
          <div class="song-info">
            <div class="song-name" id="song-name-${index}">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          </div>
          <div class="equalizer" id="eq-${index}">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        `;
        songListContainer.appendChild(item);
      });
    }

    function playSongByIndex(index) {
      currentIndex = index;
      const song = playlist[currentIndex];

      audio.src = song.file;
      audio.load();
      
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }

      document.getElementById('player-title').textContent = song.title;
      document.getElementById('player-artist').textContent = song.artist;
      document.getElementById('lyrics-song-title').textContent = song.title;
      document.getElementById('lyrics-content').textContent = song.lyrics;
      playerCover.src = song.cover;

      updateActiveSongClass();
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % playlist.length;
      playSongByIndex(currentIndex);
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      playSongByIndex(currentIndex);
    }

    function changeVolume(val) {
      audio.volume = val;
    }

    function updateActiveSongClass() {
      const items = document.querySelectorAll('.song-item');
      const currentSong = playlist[currentIndex];

      items.forEach((item, index) => {
        const songNameEl = document.getElementById(`song-name-${index}`);
        const eqBars = item.querySelectorAll('.eq-bar');

        if (index === currentIndex) {
          item.classList.add('active');

          if (!audio.paused) {
            item.classList.add('playing');
            item.style.borderImage = `linear-gradient(90deg, ${currentSong.colors[0]}, ${currentSong.colors[1]}) 1`;
            
            eqBars.forEach(bar => {
              bar.style.backgroundColor = currentSong.colors[0];
              bar.style.boxShadow = `0 0 6px ${currentSong.colors[0]}`;
            });

            if (songNameEl) {
              songNameEl.style.color = '#ffffff';
              songNameEl.style.textShadow = `0 0 8px ${currentSong.colors[0]}`;
            }
          } else {
            item.classList.remove('playing');
            item.style.borderImage = 'none';
            item.style.borderColor = 'rgba(255,255,255,0.2)';
            
            eqBars.forEach(bar => {
              bar.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
              bar.style.boxShadow = 'none';
            });

            if (songNameEl) {
              songNameEl.style.color = '#f1f5f9';
              songNameEl.style.textShadow = 'none';
            }
          }
        } else {
          item.classList.remove('active', 'playing');
          item.style.borderImage = 'none';
          item.style.borderColor = 'transparent';

          eqBars.forEach(bar => {
            bar.style.backgroundColor = 'rgba(255, 255, 255, 0.4)';
            bar.style.boxShadow = 'none';
          });

          if (songNameEl) {
            songNameEl.style.color = '#f1f5f9';
            songNameEl.style.textShadow = 'none';
          }
        }
      });
    }

    /* --- SISTEMA DE BAJOS --- */
    let audioCtx, analyser, source;

    function initAudioVisualizer() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      updateBassVisuals();
    }

    function updateBassVisuals() {
      if (!audio.paused && analyser) {
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);

        const bassValue = (dataArray[0] + dataArray[1] + dataArray[2] + dataArray[3]) / 4;
        
        const glowSize = Math.floor((bassValue / 255) * 35) + 6;
        const opacity = (bassValue / 255) * 0.8 + 0.2;

        const currentSong = playlist[currentIndex];
        const color1 = currentSong.colors[0];
        const color2 = currentSong.colors[1];

        discWrapper.style.boxShadow = `
          -${glowSize}px 0 ${glowSize}px ${color1}${Math.floor(opacity * 255).toString(16).padStart(2, '0')}, 
          ${glowSize}px 0 ${glowSize}px ${color2}${Math.floor(opacity * 255).toString(16).padStart(2, '0')},
          inset 0 0 ${glowSize / 2}px rgba(255, 255, 255, ${opacity * 0.3})
        `;
        discWrapper.style.borderColor = color1;

        requestAnimationFrame(updateBassVisuals);
      } else {
        discWrapper.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.8)';
        discWrapper.style.borderColor = 'rgba(255, 255, 255, 0.08)';
      }
    }

    audio.addEventListener('play', () => {
      discWrapper.classList.add('rotating');
      bgGifContainer.style.opacity = '1';
      document.body.classList.add('is-playing');

      if (!hasPlayedFirstTime) {
        bgGifImg.src = "https://i.postimg.cc/Dw7QrCgK/3e6e0c0d7728ecb249950b8cf3cdccb3.gif";
        document.body.classList.add('intro-mode');
        appContainer.classList.add('hidden-intro');

        if (gifSwitchTimeout) clearTimeout(gifSwitchTimeout);

        gifSwitchTimeout = setTimeout(() => {
          bgGifImg.src = "https://i.postimg.cc/tJHp1VHN/Goku-Nube.gif";
          if (!document.body.classList.contains('ui-hidden')) {
            appContainer.classList.remove('hidden-intro');
          }
          document.body.classList.remove('intro-mode');
          hasPlayedFirstTime = true;
        }, 5000);
      } else {
        bgGifImg.src = "https://i.postimg.cc/tJHp1VHN/Goku-Nube.gif";
        if (!document.body.classList.contains('ui-hidden')) {
          appContainer.classList.remove('hidden-intro');
        }
        document.body.classList.remove('intro-mode');
      }

      updateActiveSongClass();
      try {
        initAudioVisualizer();
      } catch (e) {}
    });

    audio.addEventListener('pause', () => {
      discWrapper.classList.remove('rotating');
      bgGifContainer.style.opacity = '0';
      document.body.classList.remove('intro-mode');
      document.body.classList.remove('is-playing');
      
      if (gifSwitchTimeout) clearTimeout(gifSwitchTimeout);
      if (!document.body.classList.contains('ui-hidden')) {
        appContainer.classList.remove('hidden-intro');
      }

      discWrapper.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.8)';
      discWrapper.style.borderColor = 'rgba(255, 255, 255, 0.08)';
      updateActiveSongClass();
    });

    audio.addEventListener('ended', () => {
      nextSong();
    });

    document.getElementById('lyrics-song-title').textContent = playlist[0].title;
    document.getElementById('lyrics-content').textContent = playlist[0].lyrics;

    renderPlaylist();

    /* --- ESTRELLAS NEÓN DINÁMICAS --- */
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.4 + 0.1,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }

    const neonStars = [];
    for (let i = 0; i < 40; i++) {
      neonStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 3 + 2,
        alpha: 0,
        targetAlpha: Math.random() * 0.8 + 0.2,
        pulseSpeed: Math.random() * 0.04 + 0.02
      });
    }

    function drawNeonStar(ctx, x, y, size, opacity, color) {
      ctx.save();
      ctx.translate(x, y);

      ctx.shadowBlur = size * 5;
      ctx.shadowColor = color;

      ctx.fillStyle = color;
      ctx.globalAlpha = opacity;
      ctx.beginPath();
      ctx.moveTo(0, -size * 2);
      ctx.quadraticCurveTo(0, 0, size * 2, 0);
      ctx.quadraticCurveTo(0, 0, 0, size * 2);
      ctx.quadraticCurveTo(0, 0, -size * 2, 0);
      ctx.quadraticCurveTo(0, 0, 0, -size * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, size * 0.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    let activeBall = null;

    function spawnDragonBall() {
      const fromLeft = Math.random() > 0.5;
      const speed = Math.random() * 0.3 + 0.4;
      const starsCount = Math.floor(Math.random() * 4) + 1;
      const randomY = Math.random() * 35 + 15;

      activeBall = {
        fromLeft: fromLeft,
        x: fromLeft ? -50 : canvas.width + 50,
        y: randomY,
        speedX: fromLeft ? speed : -speed,
        speedY: 0,
        stars: starsCount,
        radius: 11,
        angle: 0,
        spinSpeed: (Math.random() - 0.5) * 0.02,
        flashTimer: 0
      };
    }

    function scheduleNextDragonBall() {
      setTimeout(() => {
        spawnDragonBall();
      }, 18000);
    }

    setTimeout(spawnDragonBall, 10000);

    function drawStarVector(ctx, x, y, radius) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const spikes = 5;
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;

      ctx.moveTo(0, -radius);
      for (let i = 0; i < spikes; i++) {
        let xCoord = Math.cos(rot) * radius;
        let yCoord = Math.sin(rot) * radius;
        ctx.lineTo(xCoord, yCoord);
        rot += step;

        xCoord = Math.cos(rot) * (radius * 0.4);
        yCoord = Math.sin(rot) * (radius * 0.4);
        ctx.lineTo(xCoord, yCoord);
        rot += step;
      }
      ctx.lineTo(0, -radius);
      ctx.closePath();
      ctx.fillStyle = '#e60000';
      ctx.fill();
      ctx.restore();
    }

    function drawDragonBall(ball) {
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.angle);

      ball.flashTimer += 0.03;
      const pulse = Math.sin(ball.flashTimer);
      const glowAlpha = pulse > 0.7 ? (pulse - 0.7) * 1.5 : 0.05;

      if (glowAlpha > 0.05) {
        const glowGradient = ctx.createRadialGradient(0, 0, 2, 0, 0, ball.radius * 2.2);
        glowGradient.addColorStop(0, `rgba(255, 200, 50, ${glowAlpha})`);
        glowGradient.addColorStop(1, 'rgba(255, 120, 0, 0)');
        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      const ballGradient = ctx.createRadialGradient(-2, -2, 1, 0, 0, ball.radius);
      ballGradient.addColorStop(0, 'rgba(255, 230, 120, 0.98)');
      ballGradient.addColorStop(0.5, 'rgba(255, 150, 20, 0.92)');
      ballGradient.addColorStop(1, 'rgba(200, 70, 0, 0.95)');

      ctx.beginPath();
      ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ballGradient;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 240, 200, 0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();

      drawRedStarsVector(ctx, ball.stars, ball.radius * 0.5);

      ctx.restore();
    }

    function drawRedStarsVector(ctx, count, R) {
      const starSize = R * 0.42;
      if (count === 1) {
        drawStarVector(ctx, 0, 0, starSize);
      } else if (count === 2) {
        drawStarVector(ctx, -R * 0.35, 0, starSize);
        drawStarVector(ctx, R * 0.35, 0, starSize);
      } else if (count === 3) {
        drawStarVector(ctx, 0, -R * 0.3, starSize);
        drawStarVector(ctx, -R * 0.4, R * 0.35, starSize);
        drawStarVector(ctx, R * 0.4, R * 0.35, starSize);
      } else if (count === 4) {
        drawStarVector(ctx, -R * 0.35, -R * 0.35, starSize);
        drawStarVector(ctx, R * 0.35, -R * 0.35, starSize);
        drawStarVector(ctx, -R * 0.35, R * 0.35, starSize);
        drawStarVector(ctx, R * 0.35, R * 0.35, starSize);
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
      });

      const isPlaying = !audio.paused;
      const currentNeonColor = playlist[currentIndex].colors[0];

      neonStars.forEach(star => {
        if (isPlaying) {
          star.alpha += star.pulseSpeed;
          if (star.alpha > star.targetAlpha || star.alpha < 0.1) {
            star.pulseSpeed = -star.pulseSpeed;
          }
        } else {
          if (star.alpha > 0) {
            star.alpha -= 0.04;
          }
        }

        if (star.alpha > 0.01) {
          drawNeonStar(ctx, star.x, star.y, star.size, star.alpha, currentNeonColor);
        }
      });

      if (activeBall) {
        activeBall.x += activeBall.speedX;
        activeBall.y += activeBall.speedY;
        activeBall.angle += activeBall.spinSpeed;

        drawDragonBall(activeBall);

        const isOut = activeBall.fromLeft 
          ? (activeBall.x > canvas.width + 60)
          : (activeBall.x < -60);

        if (isOut) {
          activeBall = null;
          scheduleNextDragonBall();
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
