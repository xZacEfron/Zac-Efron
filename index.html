<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rog3r Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121824;
      background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      display: flex;
      gap: 30px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Tarjeta Principal / Perfil */
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #f8fafc;
    }

    .profile-img-container {
      width: 100%;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .playlist-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .song-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .song-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Reproductor Player */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .now-playing-label {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .disc-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 4px solid rgba(255, 255, 255, 0.1);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .current-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .current-artist {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      width: 45%;
      height: 100%;
      background: #38bdf8;
      border-radius: 3px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-control {
      background: none;
      border: none;
      color: #f8fafc;
      font-size: 20px;
      cursor: pointer;
    }

    .btn-play {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #38bdf8;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Tarjeta Izquierda (Perfil y Playlist) -->
    <div class="card">
      <div class="header-title">Rog3r</div>
      
      <!-- Foto de Perfil -->
      <div class="profile-img-container">
        <img src="https://xatimg.com/image/6Oubxy9Z0xPq.png" alt="Perfil">
      </div>

      <div class="playlist-title">Your Playlist</div>
      
      <div class="song-list">
        <div class="song-item">
          <img src="https://xatimg.com/image/6Oubxy9Z0xPq.png" alt="Cover">
          <div class="song-info">
            <div class="song-name">Freeze</div>
            <div class="song-artist">Kygo</div>
          </div>
        </div>

        <div class="song-item">
          <img src="https://xatimg.com/image/6Oubxy9Z0xPq.png" alt="Cover">
          <div class="song-info">
            <div class="song-name">HAPPY</div>
            <div class="song-artist">NF</div>
          </div>
        </div>

        <div class="song-item">
          <img src="https://xatimg.com/image/6Oubxy9Z0xPq.png" alt="Cover">
          <div class="song-info">
            <div class="song-name">This Is What It Feels Like</div>
            <div class="song-artist">Armin van Buuren</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta Derecha (Reproductor) -->
    <div class="card player-card">
      <div class="now-playing-label">Now Playing</div>
      
      <div class="disc-container">
        <img src="https://xatimg.com/image/6Oubxy9Z0xPq.png" alt="Disco">
      </div>

      <div class="current-title">Freeze</div>
      <div class="current-artist">Kygo</div>

      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>

      <div class="controls">
        <button class="btn-control">⏮</button>
        <button class="btn-play">▶</button>
        <button class="btn-control">⏭</button>
      </div>
    </div>

  </div>

</body>
</html>
