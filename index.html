<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑹𝒖 Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo GIF Dinámico */
    #bg-gif-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      overflow: hidden;
    }

    #bg-gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.45) contrast(1.1);
    }

    /* Fondo de Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      gap: 20px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 2;
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
      position: relative;
    }

    .app-container.hidden-manual {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.98);
    }

    /* Tarjetas principales con soporte para borde degradado de 2 colores */
    .card {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 340px;
      height: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
      position: relative;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.9);
      transform: translateY(-2px);
    }

    /* Botón X discreto */
    .close-card-btn {
      position: absolute;
      top: 14px;
      left: 16px;
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    body.is-playing .close-card-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .close-card-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: scale(1.1);
    }

    /* Botón para REVELAR la interfaz */
    .show-ui-trigger {
      position: fixed;
      top: 25px;
      left: 25px;
      z-index: 99;
      background: rgba(10, 10, 12, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    body.ui-hidden .show-ui-trigger {
      opacity: 1;
      pointer-events: auto;
    }

    .show-ui-trigger:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    /* Contenedor del título y el GIF camuflado */
    .header-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
      height: 30px;
    }

    .header-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .header-active-gif {
      width: 36px;
      height: 36px;
      object-fit: contain;
      display: none;
      mix-blend-mode: screen;
    }

    body.is-playing .header-active-gif {
      display: block;
    }

    /* Tarjeta 1: Perfil con Círculo Original + Efecto Zoom y Cambio al Clic */
    .profile-section-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .profile-circle-wrapper {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
      background-color: #000000;
      position: relative;
      cursor: pointer;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .profile-circle-wrapper:hover {
      transform: scale(1.08); /* Zoom al pasar el mouse */
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9);
    }

    .profile-circle-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease, opacity 0.3s ease;
    }

    .profile-circle-wrapper:hover img {
      transform: scale(1.05);
    }

    /* Mini Lista en la Tarjeta 1 */
    .mini-song-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
    }

    .mini-song-list::-webkit-scrollbar {
      width: 4px;
    }
    .mini-song-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .mini-song-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
    }

    .mini-song-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(2px);
    }

    .mini-song-item img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
    }

    .mini-song-info {
      flex: 1;
      overflow: hidden;
    }

    .mini-song-name {
      font-size: 12px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-song-artist {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Reproductor Lateral (Tarjeta 2) */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
    }

    .disc-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-top: 10px;
      margin-bottom: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      border: 4px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }

    .player-card:hover .disc-container {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rotating {
      animation: spinDisc 12s linear infinite;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .current-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .current-artist {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 0px;
    }

    /* Barra de audio personalizada */
    .custom-player-box {
      width: 100%;
      margin-top: 20px;
      background: rgba(20, 20, 25, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
      position: relative;
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      position: relative;
    }

    .progress-bar-custom {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .progress-bar-custom::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255,255,255,0.9);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .progress-bar-custom::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .player-controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .custom-play-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.2s, background 0.2s;
    }

    .custom-play-btn:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.2);
    }

    .time-display-custom {
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .options-group {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .speaker-icon {
      font-size: 13px;
      cursor: pointer;
      transition: transform 0.2s, color 0.3s ease, text-shadow 0.3s ease;
      color: #ffffff;
    }

    .speaker-icon:hover {
      transform: scale(1.2);
    }

    .volume-popup {
      position: absolute;
      bottom: 40px;
      right: 20px;
      background: rgba(15, 15, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      z-index: 20;
    }

    .volume-popup.active {
      display: flex;
    }

    .vol-slider-custom {
      -webkit-appearance: none;
      appearance: none;
      width: 90px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .vol-slider-custom::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 6px rgba(255,255,255,0.8);
      cursor: pointer;
    }

    .dots-icon {
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 1px;
      color: #ffffff;
    }

    audio {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Botón para mostrar las tarjetas -->
  <button class="show-ui-trigger" onclick="showUI()">Mostrar Tarjetas</button>

  <!-- Fondo GIF Dinámico -->
  <div id="bg-gif-container">
    <img id="bg-gif-img" src="https://i.postimg.cc/tJHp1VHN/Goku-Nube.gif" alt="Fondo Animado">
  </div>

  <!-- Canvas para Partículas y Estrellas Neón -->
  <canvas id="particles-canvas"></canvas>

  <div class="app-container" id="app-container">
    
    <!-- Tarjeta 1: Foto interactiva (Zoom + Cambio al Clic) -->
    <div class="card card-neon" id="card-1">
      <div class="close-card-btn" onclick="hideUI()" title="Ocultar interfaz">✕</div>

      <div class="header-container">
        <div class="header-title">𝑹𝒖</div>
        <img class="header-active-gif" src="https://i.postimg.cc/Xq9vWyzw/d073c3f982bb6dac9967ac46a5c49038.gif" alt="GIF Activo">
      </div>

      <div class="profile-section-top">
        <div class="profile-circle-wrapper" onclick="toggleProfileImage()">
          <img id="profile-img" src="https://xatimg.com/image/YK3BJIfpJQHB.png" alt="Ru Photo">
        </div>
      </div>

      <div class="mini-song-list" id="mini-song-list-container">
        <!-- Mini canciones cargadas dinámicamente -->
      </div>
    </div>

    <!-- Tarjeta 2: Reproductor Lateral -->
    <div class="card player-card card-neon" id="card-2">
      <div class="close-card-btn" onclick="hideUI()" title="Ocultar interfaz">✕</div>

      <div class="disc-container" id="disc-wrapper">
        <img id="player-cover" src="https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg" alt="Kids">
      </div>

      <div class="current-title" id="player-title">Kids</div>
      <div class="current-artist" id="player-artist">MGMT</div>

      <!-- Barra de audio -->
      <div class="custom-player-box" id="custom-player-box">
        <div class="progress-container">
          <input type="range" class="progress-bar-custom" id="progress-bar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
        </div>
        <div class="player-controls-row">
          <div class="custom-play-btn" id="play-btn" onclick="togglePlayPause()">▶</div>
          <div class="time-display-custom" id="time-text">0:00 / 0:00</div>
          <div class="options-group">
            <span class="speaker-icon" id="speaker-icon" onclick="toggleVolumePopup(event)">🔊</span>
            
            <div class="volume-popup" id="volume-popup">
              <input type="range" class="vol-slider-custom" id="vol-slider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
            </div>

            <span class="dots-icon" id="dots-icon">•••</span>
          </div>
        </div>
      </div>

      <audio id="main-audio" crossorigin="anonymous" src="MGMT - Kids.mp3"></audio>
    </div>

  </div>

  <script>
    /* --- LÓGICA DE CAMBIO DE FOTO AL DAR CLIC --- */
    const img1 = "https://xatimg.com/image/YK3BJIfpJQHB.png";
    const img2 = "https://xatimg.com/image/Jg23jlU0z2hq.png";

    function toggleProfileImage() {
      const profileImg = document.getElementById('profile-img');
      profileImg.style.opacity = '0.3';
      setTimeout(() => {
        if (profileImg.src === img1) {
          profileImg.src = img2;
        } else {
          profileImg.src = img1;
        }
        profileImg.style.opacity = '1';
      }, 150);
    }

    function hideUI() {
      const appContainer = document.getElementById('app-container');
      appContainer.classList.add('hidden-manual');
      document.body.classList.add('ui-hidden');
    }

    function showUI() {
      const appContainer = document.getElementById('app-container');
      appContainer.classList.remove('hidden-manual');
      document.body.classList.remove('ui-hidden');
    }

    /* PLAYLIST */
    const playlist = [
      { file: 'MGMT - Kids.mp3', title: 'Kids', artist: 'MGMT', cover: 'https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg', colors: ['#00f0ff', '#ff0033'] },
      { file: 'Kygo - Before You Know It.mp3', title: 'Before You Know It', artist: 'Kygo', cover: 'https://i.postimg.cc/sXFZmG2z/8cc38ce80cb43e99d974f011f7714c19.jpg', colors: ['#ffee00', '#00f0ff'] },
      { file: 'Avicii - Fade Into Darkness (Vocal Radio Mix).mp3', title: 'Fade Into Darkness', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg', colors: ['#ffee00', '#ff0033'] },
      { file: 'Men at Work - Down Under.mp3', title: 'Down Under', artist: 'Men at Work', cover: 'https://i.postimg.cc/W39WqBr1/R-1687205-1236953371.jpg', colors: ['#ff0033', '#00f0ff'] },
      { file: 'TV on the Radio - Wolf Like Me.mp3', title: 'Wolf Like Me', artist: 'TV on the Radio', cover: 'https://i.postimg.cc/wjH32D9Y/images.jpg', colors: ['#00f0ff', '#2a0845'] },
      { file: 'NF - HAPPY.mp3', title: 'HAPPY', artist: 'NF', cover: 'https://i.postimg.cc/vTNTZn56/Nf-Happy.jpg', colors: ['#00f0ff', '#2a0845'] },
      { file: 'Avicii - I Could Be The One (Avicii Vs. Nicky Romero) (Radio Edit).mp3', title: 'I Could Be The One', artist: 'Avicii Vs. Nicky Romero', cover: 'https://i.postimg.cc/wj89HNvZ/ab67616d0000b273d1f3c40cd2e251e04ae6413f.jpg', colors: ['#ff0033', '#00f0ff'] },
      { file: 'Green Day - Whatsername.mp3', title: 'Whatsername', artist: 'Green Day', cover: 'https://i.postimg.cc/SxC1F22V/ab67616d0000b27308a1b1e0674086d3f1995e1b.jpg', colors: ['#39ff14', '#00f0ff'] },
      { file: 'Kygo - Think About You.mp3', title: 'Think About You', artist: 'Kygo', cover: 'https://i.postimg.cc/sXFZmG2z/8cc38ce80cb43e99d974f011f7714c19.jpg', colors: ['#ffee00', '#2a0845'] },
      { file: 'Kygo - Stargazing.mp3', title: 'Stargazing', artist: 'Kygo', cover: 'https://i.postimg.cc/xC7SZVHk/images-(2).jpg', colors: ['#00f0ff', '#ff0033'] },
      { file: 'NF - SORRY.mp3', title: 'SORRY', artist: 'NF', cover: 'https://i.postimg.cc/bY5mZH1V/1900x1900-000000-80-0-0.jpg', colors: ['#ff0033', '#2a0845'] },
      { file: 'Kygo - Freeze.mp3', title: 'Freeze', artist: 'Kygo', cover: 'https://i.postimg.cc/htHm0kzP/Kygo.jpg', colors: ['#00f0ff', '#ffffff'] },
      { file: 'Tiësto - Red Lights.mp3', title: 'Red Lights', artist: 'Tiësto', cover: 'https://i.postimg.cc/KcJgWk3z/ab67616d0000b2734ca8d06b996fb365b62d3d9c.jpg', colors: ['#ff0000', '#00f0ff'] },
      { file: 'Avicii - The Nights.mp3', title: 'The Nights', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg', colors: ['#ffee00', '#00f0ff'] },
      { file: 'CADU! - On My Way.mp3', title: 'On My Way', artist: 'CADU!', cover: 'https://i.postimg.cc/SNpwtmnZ/images.jpg', colors: ['#ffee00', '#00f0ff'] },
      { file: 'Kygo - Save My Love.mp3', title: 'Save My Love', artist: 'Kygo', cover: 'https://i.postimg.cc/kMt9LD5c/images.jpg', colors: ['#00f0ff', '#ff0033'] },
      { file: 'Martin Garrix - The Only Way Is Up.mp3', title: 'The Only Way Is Up', artist: 'Martin Garrix', cover: 'https://i.postimg.cc/CxDHBGmM/images-(1).jpg', colors: ['#39ff14', '#00f0ff'] },
      { file: 'Eminem - Somebody Save Me.mp3', title: 'Somebody Save Me', artist: 'Eminem', cover: 'https://i.postimg.cc/90ntT163/ab67616d0000b273a5f33cd0d7e1223a0fbd865e.jpg', colors: ['#ffffff', '#ff0000'] },
      { file: 'Marshmello - Be Kind.mp3', title: 'Be Kind', artist: 'Marshmello', cover: 'https://i.postimg.cc/sDMJydWc/0x1900-000000-80-0-0-(1).jpg', colors: ['#00f0ff', '#ff0033'] },
      { file: 'Justin Bieber - Ghost.mp3', title: 'Ghost', artist: 'Justin Bieber', cover: 'https://i.postimg.cc/MpdVgzZ5/images.jpg', colors: ['#00f0ff', '#2a0845'] },
      { file: 'A Flock of Seagulls - I Ran (So Far Away).mp3', title: 'I Ran (So Far Away)', artist: 'A Flock of Seagulls', cover: 'https://i.postimg.cc/cCPhP0d2/0x1900-000000-80-0-0.jpg', colors: ['#00f0ff', '#ff0033'] },
      { file: 'OneRepublic - Apologize.mp3', title: 'Apologize', artist: 'OneRepublic', cover: 'https://i.postimg.cc/TwbdjPLQ/ab67616d0000b27334ef81d1ff3b4682a4e97f70.jpg', colors: ['#00f0ff', '#2a0845'] },
      { file: 'Kid Ink - Money and the Power.mp3', title: 'Money and the Power', artist: 'Kid Ink', cover: 'https://i.postimg.cc/BZHhkPrb/8c2004d2635aa15acb1b4e425bc061b9-1000x1000x1.jpg', colors: ['#ffee00', '#2a0845'] }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('main-audio');
    const playerCover = document.getElementById('player-cover');
    const discWrapper = document.getElementById('disc-wrapper');
    const card1 = document.getElementById('card-1');
    const card2 = document.getElementById('card-2');
    const miniSongListContainer = document.getElementById('mini-song-list-container');
    const bgGifContainer = document.getElementById('bg-gif-container');
    const appContainer = document.getElementById('app-container');

    const customPlayerBox = document.getElementById('custom-player-box');
    const playBtn = document.getElementById('play-btn');
    const progressBar = document.getElementById('progress-bar');
    const timeText = document.getElementById('time-text');
    const speakerIcon = document.getElementById('speaker-icon');
    const volumePopup = document.getElementById('volume-popup');
    const volSlider = document.getElementById('vol-slider');
    const dotsIcon = document.getElementById('dots-icon');

    function renderMiniPlaylist() {
      miniSongListContainer.innerHTML = '';
      playlist.forEach((song, index) => {
        const miniItem = document.createElement('div');
        miniItem.className = `mini-song-item`;
        miniItem.onclick = () => playSongByIndex(index);

        miniItem.innerHTML = `
          <img src="${song.cover}" alt="${song.title}">
          <div class="mini-song-info">
