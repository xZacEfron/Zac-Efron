<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rog3r Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121824;
      background-image: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      display: flex;
      gap: 30px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Tarjeta Principal / Perfil */
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #f8fafc;
    }

    .profile-img-container {
      width: 100%;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .playlist-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .song-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .song-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Reproductor Player */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .now-playing-label {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .disc-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 4px solid rgba(255, 255, 255, 0.1);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .current-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .current-artist {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      filter: invert(0.9) hue-rotate(180deg);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Tarjeta Izquierda (Perfil y Playlist) -->
    <div class="card">
      <div class="header-title">Rog3r</div>
      
      <!-- Foto de Perfil -->
      <div class="profile-img-container">
        <img src="https://xatimg.com/image/6Oubxy9Z0xPq.png" alt="Perfil">
      </div>

      <div class="playlist-title">Your Playlist</div>
      
      <div class="song-list">
        <div class="song-item">
          <img src="https://i.scdn.co/image/ab67616d0000b273fa138c29b7941fa9e4e6f4a8" alt="Red Lights">
          <div class="song-info">
            <div class="song-name">Red Lights</div>
            <div class="song-artist">Tiësto</div>
          </div>
        </div>

        <div class="song-item">
          <img src="https://i.scdn.co/image/ab67616d0000b2738a9d18b32338ff9134a94829" alt="Freeze">
          <div class="song-info">
            <div class="song-name">Freeze</div>
            <div class="song-artist">Kygo</div>
          </div>
        </div>

        <div class="song-item">
          <img src="https://i.scdn.co/image/ab67616d0000b27361730f08a54d5c90715e4a83" alt="HAPPY">
          <div class="song-info">
            <div class="song-name">HAPPY</div>
            <div class="song-artist">NF</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta Derecha (Reproductor) -->
    <div class="card player-card">
      <div class="now-playing-label">Now Playing</div>
      
      <div class="disc-container">
        <img src="https://i.scdn.co/image/ab67616d0000b273fa138c29b7941fa9e4e6f4a8" alt="Tiësto - Red Lights">
      </div>

      <div class="current-title">Red Lights</div>
      <div class="current-artist">Tiësto</div>

      <!-- Enlace al archivo subido -->
      <audio controls autoplay loop>
        <source src="Tiësto - Red Lights.mp3" type="audio/mpeg">
        Tu navegador no soporta el reproductor de audio.
      </audio>
    </div>

  </div>

</body>
</html>
