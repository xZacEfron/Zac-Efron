<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rog3r Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #050508;
      background-image: radial-gradient(circle at 50% 50%, #0d1117 0%, #000000 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app-container {
      display: flex;
      gap: 30px;
      max-width: 900px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Tarjeta Principal / Perfil */
    .card {
      background: rgba(15, 20, 28, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 360px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #f8fafc;
      text-align: center;
    }

    .profile-img-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 24px auto;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .profile-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .playlist-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(4px);
    }

    .song-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .song-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Reproductor Player */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .now-playing-label {
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .disc-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      border: 4px solid rgba(255, 255, 255, 0.1);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .current-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .current-artist {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      filter: invert(0.9) hue-rotate(180deg);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Tarjeta Izquierda (Perfil y Playlist) -->
    <div class="card">
      <div class="header-title">Rog3r</div>
      
      <!-- Foto de Perfil Circular -->
      <div class="profile-img-container">
        <img src="https://xatimg.com/image/3DTp4snrSCDj.jpg" alt="Rog3r">
      </div>

      <div class="playlist-title">Your Playlist</div>
      
      <div class="song-list">
        <!-- Canción 1 -->
        <div class="song-item" onclick="playSong('Kygo - Freeze.mp3', 'Freeze', 'Kygo', 'https://i.postimg.cc/htHm0kzP/Kygo.jpg')">
          <img src="https://i.postimg.cc/htHm0kzP/Kygo.jpg" alt="Freeze">
          <div class="song-info">
            <div class="song-name">Freeze</div>
            <div class="song-artist">Kygo</div>
          </div>
        </div>

        <!-- Canción 2 -->
        <div class="song-item" onclick="playSong('Tiësto - Red Lights.mp3', 'Red Lights', 'Tiësto', 'https://i.postimg.cc/KcJgWk3z/ab67616d0000b2734ca8d06b996fb365b62d3d9c.jpg')">
          <img src="https://i.postimg.cc/KcJgWk3z/ab67616d0000b2734ca8d06b996fb365b62d3d9c.jpg" alt="Red Lights">
          <div class="song-info">
            <div class="song-name">Red Lights</div>
            <div class="song-artist">Tiësto</div>
          </div>
        </div>

        <!-- Canción 3 -->
        <div class="song-item" onclick="playSong('NF - HAPPY.mp3', 'HAPPY', 'NF', 'https://i.postimg.cc/vTNTZn56/Nf-Happy.jpg')">
          <img src="https://i.postimg.cc/vTNTZn56/Nf-Happy.jpg" alt="HAPPY">
          <div class="song-info">
            <div class="song-name">HAPPY</div>
            <div class="song-artist">NF</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta Derecha (Reproductor) -->
    <div class="card player-card">
      <div class="now-playing-label">Now Playing</div>
      
      <div class="disc-container">
        <img id="player-cover" src="https://i.postimg.cc/htHm0kzP/Kygo.jpg" alt="Kygo - Freeze">
      </div>

      <div class="current-title" id="player-title">Freeze</div>
      <div class="current-artist" id="player-artist">Kygo</div>

      <!-- Reproductor de Audio -->
      <audio id="main-audio" controls autoplay loop>
        <source id="audio-source" src="Kygo - Freeze.mp3" type="audio/mpeg">
        Tu navegador no soporta el reproductor de audio.
      </audio>
    </div>

  </div>

  <script>
    function playSong(file, title, artist, cover) {
      const audio = document.getElementById('main-audio');
      const source = document.getElementById('audio-source');
      const titleEl = document.getElementById('player-title');
      const artistEl = document.getElementById('player-artist');
      const coverEl = document.getElementById('player-cover');

      source.src = file;
      audio.load();
      audio.play();

      titleEl.textContent = title;
      artistEl.textContent = artist;
      coverEl.src = cover;
    }
  </script>

</body>
</html>
