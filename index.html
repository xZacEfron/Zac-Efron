<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑹𝒖 Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo de Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 1;
    }

    /* Tarjetas principales con efecto Glow Hover */
    .card {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 340px;
      height: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.9);
      transform: translateY(-2px);
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      color: #f8fafc;
      text-align: center;
    }

    /* --- EFECTO DE TARJETA VOLTEABLE (FLIP CARD 3D) --- */
    .flip-card-container {
      width: 100%;
      flex: 1;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card-container.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flip-front::after, .flip-back::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transform: skewX(-25deg);
      transition: left 0.75s ease;
    }

    .flip-card-container:hover .flip-front::after,
    .flip-card-container:hover .flip-back::after {
      left: 150%;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    .full-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .full-img-container img {
        object-fit: contain;
      }
    }

    /* Lista de canciones */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow-y: auto;
      padding-right: 6px;
    }

    .song-list::-webkit-scrollbar {
      width: 5px;
    }
    .song-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 10px;
    }
    .song-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.03);
      transform: translateX(4px);
    }

    .song-item.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .song-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
    }

    .song-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Ecualizador Animado */
    .equalizer {
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      padding-right: 4px;
    }

    .song-item.active .equalizer {
      display: flex;
    }

    .eq-bar {
      width: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .song-item.playing .eq-bar {
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    .song-item.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .song-item.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .song-item.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; }

    @keyframes eqBounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    /* Reproductor Lateral */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
    }

    .disc-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-top: 15px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      border: 4px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .player-card:hover .disc-container {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rotating {
      animation: spinDisc 12s linear infinite, discGlowDark 2.5s ease-in-out infinite alternate;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes discGlowDark {
      from { box-shadow: 0 0 10px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5); }
      to { box-shadow: 0 0 20px rgba(255, 255, 255, 0.05), 0 0 25px rgba(0, 0, 0, 0.9); }
    }

    .current-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .current-artist {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      filter: invert(0.9) hue-rotate(180deg);
    }
  </style>
</head>
<body>

  <!-- Canvas para Partículas y Esferas Giratorias -->
  <canvas id="particles-canvas"></canvas>

  <div class="app-container">
    
    <!-- Tarjeta 1: 𝑹𝒖 + Foto Volteable (Flip Card) -->
    <div class="card">
      <div class="header-title">𝑹𝒖</div>
      <div class="flip-card-container" id="flip-card" onclick="toggleCardFlip()">
        <div class="flip-card-inner">
          <div class="flip-front full-img-container">
            <img src="https://xatimg.com/image/Pkjoaoso0fgK.jpg" alt="Ru Photo 1">
          </div>
          <div class="flip-back full-img-container">
            <img src="https://xatimg.com/image/Jg23jlU0z2hq.png" alt="Ru Photo 2">
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 2: Playlist -->
    <div class="card">
      <div class="song-list" id="song-list-container">
        <!-- Canciones cargadas por script -->
      </div>
    </div>

    <!-- Tarjeta 3: Reproductor Lateral -->
    <div class="card player-card">
      <div class="disc-container" id="disc-wrapper">
        <img id="player-cover" src="https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg" alt="Kids">
      </div>

      <div class="current-title" id="player-title">Kids</div>
      <div class="current-artist" id="player-artist">MGMT</div>

      <!-- Reproductor de Audio -->
      <audio id="main-audio" controls controlsList="nodownload" src="MGMT - Kids.mp3"></audio>
    </div>

  </div>

  <script>
    function toggleCardFlip() {
      const card = document.getElementById('flip-card');
      card.classList.toggle('flipped');
    }

    const playlist = [
      { file: 'MGMT - Kids.mp3', title: 'Kids', artist: 'MGMT', cover: 'https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg' },
      { file: 'Green Day - Whatsername.mp3', title: 'Whatsername', artist: 'Green Day', cover: 'https://i.postimg.cc/SxC1F22V/ab67616d0000b27308a1b1e0674086d3f1995e1b.jpg' },
      { file: 'NF - HAPPY.mp3', title: 'HAPPY', artist: 'NF', cover: 'https://i.postimg.cc/vTNTZn56/Nf-Happy.jpg' },
      { file: 'TV on the Radio - Wolf Like Me.mp3', title: 'Wolf Like Me', artist: 'TV on the Radio', cover: 'https://i.postimg.cc/wjH32D9Y/images.jpg' },
      { file: 'Avicii - Fade Into Darkness (Vocal Radio Mix).mp3', title: 'Fade Into Darkness', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg' },
      { file: 'NF - SORRY.mp3', title: 'SORRY', artist: 'NF', cover: 'https://i.postimg.cc/bY5mZH1V/1900x1900-000000-80-0-0.jpg' },
      { file: 'Avicii - I Could Be The One (Avicii Vs. Nicky Romero) (Radio Edit).mp3', title: 'I Could Be The One', artist: 'Avicii Vs. Nicky Romero', cover: 'https://i.postimg.cc/wj89HNvZ/ab67616d0000b273d1f3c40cd2e251e04ae6413f.jpg' },
      { file: 'Kygo - Freeze.mp3', title: 'Freeze', artist: 'Kygo', cover: 'https://i.postimg.cc/htHm0kzP/Kygo.jpg' },
      { file: 'Tiësto - Red Lights.mp3', title: 'Red Lights', artist: 'Tiësto', cover: 'https://i.postimg.cc/KcJgWk3z/ab67616d0000b2734ca8d06b996fb365b62d3d9c.jpg' },
      { file: 'Avicii - The Nights.mp3', title: 'The Nights', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg' },
      { file: 'Kygo - Save My Love.mp3', title: 'Save My Love', artist: 'Kygo', cover: 'https://i.postimg.cc/kMt9LD5c/images.jpg' },
      { file: 'Kygo - Stargazing.mp3', title: 'Stargazing', artist: 'Kygo', cover: 'https://i.postimg.cc/xC7SZVHk/images-(2).jpg' },
      { file: 'Martin Garrix - The Only Way Is Up.mp3', title: 'The Only Way Is Up', artist: 'Martin Garrix', cover: 'https://i.postimg.cc/CxDHBGmM/images-(1).jpg' },
      { file: 'Eminem - Somebody Save Me.mp3', title: 'Somebody Save Me', artist: 'Eminem', cover: 'https://i.postimg.cc/90ntT163/ab67616d0000b273a5f33cd0d7e1223a0fbd865e.jpg' },
      { file: 'Marshmello - Be Kind.mp3', title: 'Be Kind', artist: 'Marshmello', cover: 'https://i.postimg.cc/sDMJydWc/0x1900-000000-80-0-0-(1).jpg' },
      { file: 'Justin Bieber - Ghost.mp3', title: 'Ghost', artist: 'Justin Bieber', cover: 'https://i.postimg.cc/MpdVgzZ5/images.jpg' },
      { file: 'A Flock of Seagulls - I Ran (So Far Away).mp3', title: 'I Ran (So Far Away)', artist: 'A Flock of Seagulls', cover: 'https://i.postimg.cc/cCPhP0d2/0x1900-000000-80-0-0.jpg' },
      { file: 'OneRepublic - Apologize.mp3', title: 'Apologize', artist: 'OneRepublic', cover: 'https://i.postimg.cc/TwbdjPLQ/ab67616d0000b27334ef81d1ff3b4682a4e97f70.jpg' },
      { file: 'Kid Ink - Money and the Power.mp3', title: 'Money and the Power', artist: 'Kid Ink', cover: 'https://i.postimg.cc/BZHhkPrb/8c2004d2635aa15acb1b4e425bc061b9-1000x1000x1.jpg' },
      { file: 'Brandon Heath - Whole Heart.mp3', title: 'Whole Heart', artist: 'Brandon Heath', cover: 'https://i.postimg.cc/C5TcdwqS/ab67616d0000b273fcc3216f7eff222b4c4433d7.jpg' }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('main-audio');
    const playerCover = document.getElementById('player-cover');
    const discWrapper = document.getElementById('disc-wrapper');
    const songListContainer = document.getElementById('song-list-container');

    function renderPlaylist() {
      songListContainer.innerHTML = '';
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
        item.onclick = () => playSongByIndex(index);

        item.innerHTML = `
          <img src="${song.cover}" alt="${song.title}">
          <div class="song-info">
            <div class="song-name">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          </div>
          <div class="equalizer">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        `;
        songListContainer.appendChild(item);
      });
    }

    function playSongByIndex(index) {
      currentIndex = index;
      const song = playlist[currentIndex];

      audio.src = song.file;
      audio.load();
      
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }

      document.getElementById('player-title').textContent = song.title;
      document.getElementById('player-artist').textContent = song.artist;
      playerCover.src = song.cover;

      updateActiveSongClass();
    }

    function updateActiveSongClass() {
      const items = document.querySelectorAll('.song-item');
      items.forEach((item, index) => {
        if (index === currentIndex) {
          item.classList.add('active');
          if (!audio.paused) {
            item.classList.add('playing');
          } else {
            item.classList.remove('playing');
          }
        } else {
          item.classList.remove('active', 'playing');
        }
      });
    }

    audio.addEventListener('play', () => {
      discWrapper.classList.add('rotating');
      updateActiveSongClass();
    });

    audio.addEventListener('pause', () => {
      discWrapper.classList.remove('rotating');
      updateActiveSongClass();
    });

    audio.addEventListener('ended', () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      playSongByIndex(currentIndex);
    });

    renderPlaylist();

    /* --- SISTEMA DE ESFERAS DEL DRAGÓN (TODA LA ALTURA, LENTAS, CHICAS, GIRATORIAS, CADA 15s) --- */
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 1. Partículas sutiles de fondo
    const particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.4 + 0.1,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }

    // 2. Esfera del Dragón Volando
    let activeBall = null;

    function spawnDragonBall() {
      const fromLeft = Math.random() > 0.5; // Sale aleatoriamente de izquierda o derecha
      const speed = Math.random() * 0.35 + 0.45; // Muy lento, flotando
      const starsCount = Math.floor(Math.random() * 7) + 1; // 1 a 7 estrellas

      // DISTRIBUCIÓN VERTICAL COMPLETA (abarca de arriba a abajo de la pantalla)
      const randomY = Math.random() * (canvas.height - 100) + 50;

      activeBall = {
        fromLeft: fromLeft,
        x: fromLeft ? -50 : canvas.width + 50,
        y: randomY,
        speedX: fromLeft ? speed : -speed,
        speedY: (Math.random() - 0.5) * 0.08,
        stars: starsCount,
        radius: 9, // Tamaño chico
        angle: 0,
        spinSpeed: (Math.random() - 0.5) * 0.025 // Giro suave
      };
    }

    function scheduleNextDragonBall() {
      // Intervalo estricto de 15 segundos
      setTimeout(() => {
        spawnDragonBall();
      }, 15000);
    }

    // Primera aparición a los 3 segundos
    setTimeout(spawnDragonBall, 3000);

    function drawDragonBall(ball) {
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.angle); // Giro constante

      // Resplandor cálido de fondo
      const glowGradient = ctx.createRadialGradient(0, 0, 1, 0, 0, ball.radius * 1.6);
      glowGradient.addColorStop(0, 'rgba(255, 180, 50, 0.4)');
      glowGradient.addColorStop(1, 'rgba(255, 140, 0, 0)');
      ctx.fillStyle = glowGradient;
      ctx.beginPath();
      ctx.arc(0, 0, ball.radius * 1.6, 0, Math.PI * 2);
      ctx.fill();

      // Esfera de cristal naranja
      const ballGradient = ctx.createRadialGradient(-2, -2, 1, 0, 0, ball.radius);
      ballGradient.addColorStop(0, 'rgba(255, 220, 100, 0.95)');
      ballGradient.addColorStop(0.5, 'rgba(255, 150, 20, 0.9)');
      ballGradient.addColorStop(1, 'rgba(210, 80, 0, 0.9)');

      ctx.beginPath();
      ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ballGradient;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 230, 180, 0.4)';
      ctx.lineWidth = 0.8;
      ctx.stroke();

      // Dibujar estrellas rojas en el centro
      drawRedStars(ctx, ball.stars, ball.radius * 0.55);

      ctx.restore();
    }

    function drawRedStars(ctx, count, radius) {
      ctx.fillStyle = '#d91414';
      ctx.font = `${radius * 0.95}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      if (count === 1) {
        ctx.fillText('★', 0, 0);
      } else if (count === 2) {
        ctx.fillText('★', -radius * 0.35, 0);
        ctx.fillText('★', radius * 0.35, 0);
      } else if (count === 3) {
        ctx.fillText('★', 0, -radius * 0.3);
        ctx.fillText('★', -radius * 0.4, radius * 0.3);
        ctx.fillText('★', radius * 0.4, radius * 0.3);
      } else if (count === 4) {
        ctx.fillText('★', -radius * 0.3, -radius * 0.3);
        ctx.fillText('★', radius * 0.3, -radius * 0.3);
        ctx.fillText('★', -radius * 0.3, radius * 0.3);
        ctx.fillText('★', radius * 0.3, radius * 0.3);
      } else if (count === 5) {
        ctx.fillText('★', 0, 0);
        ctx.fillText('★', -radius * 0.45, -radius * 0.45);
        ctx.fillText('★', radius * 0.45, -radius * 0.45);
        ctx.fillText('★', -radius * 0.45, radius * 0.45);
        ctx.fillText('★', radius * 0.45, radius * 0.45);
      } else if (count === 6) {
        ctx.fillText('★', -radius * 0.35, -radius * 0.4);
        ctx.fillText('★', radius * 0.35, -radius * 0.4);
        ctx.fillText('★', -radius * 0.45, 0);
        ctx.fillText('★', radius * 0.45, 0);
        ctx.fillText('★', -radius * 0.35, radius * 0.4);
        ctx.fillText('★', radius * 0.35, radius * 0.4);
      } else if (count === 7) {
        ctx.fillText('★', 0, 0);
        ctx.fillText('★', 0, -radius * 0.5);
        ctx.fillText('★', -radius * 0.45, -radius * 0.2);
        ctx.fillText('★', radius * 0.45, -radius * 0.2);
        ctx.fillText('★', -radius * 0.45, radius * 0.3);
        ctx.fillText('★', radius * 0.45, radius * 0.3);
        ctx.fillText('★', 0, radius * 0.5);
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
      });

      if (activeBall) {
        activeBall.x += activeBall.speedX;
        activeBall.y += activeBall.speedY;
        activeBall.angle += activeBall.spinSpeed;

        drawDragonBall(activeBall);

        const isOut = activeBall.fromLeft 
          ? (activeBall.x > canvas.width + 60)
          : (activeBall.x < -60);

        if (isOut) {
          activeBall = null;
          scheduleNextDragonBall();
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>

</body>
</html>
