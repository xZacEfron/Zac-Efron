<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝑹𝒖 Space</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo de Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app-container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
      z-index: 1;
    }

    /* Tarjetas principales */
    .card {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 24px;
      width: 340px;
      height: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }

    .card:hover {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08), 0 20px 40px rgba(0, 0, 0, 0.9);
      transform: translateY(-2px);
    }

    /* Título "𝑹𝒖" más fino y estilizado */
    .header-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-align: center;
      color: #ffffff;
    }

    /* --- CONTADOR INVISIBLE --- */
    .visit-counter {
      display: none;
    }

    /* --- TARJETA VOLTEABLE (FLIP CARD) --- */
    .flip-card-container {
      width: 100%;
      flex: 1;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
      border-radius: 20px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }

    .flip-card-container.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-front, .flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flip-front::after, .flip-back::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      transform: skewX(-25deg);
      transition: left 0.75s ease;
    }

    .flip-card-container:hover .flip-front::after,
    .flip-card-container:hover .flip-back::after {
      left: 150%;
    }

    .flip-back {
      transform: rotateY(180deg);
    }

    .full-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      .full-img-container img {
        object-fit: contain;
      }
    }

    /* Lista de canciones */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      overflow-y: auto;
      padding-right: 6px;
    }

    .song-list::-webkit-scrollbar {
      width: 5px;
    }
    .song-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 10px;
    }
    .song-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      position: relative;
      transition: background 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    .song-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.03);
      transform: translateX(4px);
    }

    .song-item.active {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Borde en degradado Rojo/Azul en la canción sonando */
    .song-item.playing {
      background: linear-gradient(90deg, rgba(255, 0, 51, 0.06), rgba(0, 229, 255, 0.06));
      border: 1px solid transparent;
      border-image: linear-gradient(90deg, rgba(255, 0, 51, 0.8), rgba(0, 229, 255, 0.8)) 1;
      border-radius: 12px;
      box-shadow: -4px 0 12px rgba(255, 0, 51, 0.25), 4px 0 12px rgba(0, 229, 255, 0.25);
    }

    .song-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }

    .song-info {
      flex: 1;
    }

    .song-name {
      font-size: 15px;
      font-weight: 600;
      color: #f1f5f9;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .song-artist {
      font-size: 13px;
      color: #94a3b8;
    }

    /* Ecualizador Animado */
    .equalizer {
      display: none;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      padding-right: 4px;
    }

    .song-item.active .equalizer {
      display: flex;
    }

    .eq-bar {
      width: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      height: 4px;
      transition: height 0.2s ease;
    }

    .song-item.playing .eq-bar {
      animation: eqBounce 0.8s ease-in-out infinite alternate;
    }

    .song-item.playing .eq-bar:nth-child(1) { animation-delay: 0.1s; background-color: #ff0033; }
    .song-item.playing .eq-bar:nth-child(2) { animation-delay: 0.3s; background-color: #ffffff; }
    .song-item.playing .eq-bar:nth-child(3) { animation-delay: 0.2s; background-color: #00e5ff; }

    @keyframes eqBounce {
      0% { height: 20%; }
      100% { height: 100%; }
    }

    /* Reproductor Lateral */
    .player-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
    }

    .disc-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      margin-top: 15px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      border: 4px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.1s ease, box-shadow 0.1s ease;
    }

    .player-card:hover .disc-container {
      border-color: rgba(255, 255, 255, 0.25);
    }

    .disc-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .rotating {
      animation: spinDisc 12s linear infinite;
    }

    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .current-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .current-artist {
      font-size: 15px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* Reproductor nativo original con su filtro limpio */
    audio {
      width: 100%;
      margin-top: 15px;
      border-radius: 12px;
      filter: invert(0.9) hue-rotate(180deg);
      transition: box-shadow 0.2s ease;
      border: 1px solid transparent;
    }

    audio::-webkit-media-controls-mute-button {
      filter: hue-rotate(140deg) saturate(2);
    }
  </style>
</head>
<body>

  <!-- Canvas para Partículas y Esferas -->
  <canvas id="particles-canvas"></canvas>

  <!-- Elemento invisible para el contador -->
  <div class="visit-counter" id="visits-number">0</div>

  <div class="app-container">
    
    <!-- Tarjeta 1: 𝑹𝒖 + Foto Volteable (Limpia y sobria) -->
    <div class="card">
      <div class="header-title">𝑹𝒖</div>
      <div class="flip-card-container" id="flip-card" onclick="toggleCardFlip()">
        <div class="flip-card-inner">
          <div class="flip-front full-img-container">
            <img src="https://xatimg.com/image/6psP1KrS59m9.jpg" alt="Ru Photo 1">
          </div>
          <div class="flip-back full-img-container">
            <img src="https://xatimg.com/image/Jg23jlU0z2hq.png" alt="Ru Photo 2">
          </div>
        </div>
      </div>
    </div>

    <!-- Tarjeta 2: Playlist -->
    <div class="card">
      <div class="song-list" id="song-list-container">
        <!-- Canciones cargadas por script -->
      </div>
    </div>

    <!-- Tarjeta 3: Reproductor Lateral -->
    <div class="card player-card">
      <div class="disc-container" id="disc-wrapper">
        <img id="player-cover" src="https://i.postimg.cc/sXFZmG2z/8cc38ce80cb43e99d974f011f7714c19.jpg" alt="Before You Know It">
      </div>

      <div class="current-title" id="player-title">Before You Know It</div>
      <div class="current-artist" id="player-artist">Kygo</div>

      <!-- Reproductor de Audio -->
      <audio id="main-audio" controls controlsList="nodownload" crossorigin="anonymous" src="Kygo - Before You Know It.mp3"></audio>
    </div>

  </div>

  <script>
    /* --- CONTADOR EXCLUSIVO "RugerP" PRIVADO --- */
    async function initVisitorCounter() {
      let currentVisits = parseInt(localStorage.getItem('rugerp_space_visits') || '0') + 1;
      localStorage.setItem('rugerp_space_visits', currentVisits);

      try {
        const response = await fetch('https://api.countapi.xyz/hit/rugerp-space-key-2026/visits');
        if (response.ok) {
          const data = await response.json();
          currentVisits = data.value;
        }
      } catch (e) {}

      console.log("---------------------------------------");
      console.log("📊 TOTAL DE VISITAS EN TU SPACE (RugerP): " + currentVisits);
      console.log("---------------------------------------");
    }
    initVisitorCounter();

    function toggleCardFlip() {
      const card = document.getElementById('flip-card');
      card.classList.toggle('flipped');
    }

    const playlist = [
      { file: 'Kygo - Before You Know It.mp3', title: 'Before You Know It', artist: 'Kygo', cover: 'https://i.postimg.cc/sXFZmG2z/8cc38ce80cb43e99d974f011f7714c19.jpg' },
      { file: 'Green Day - Whatsername.mp3', title: 'Whatsername', artist: 'Green Day', cover: 'https://i.postimg.cc/SxC1F22V/ab67616d0000b27308a1b1e0674086d3f1995e1b.jpg' },
      { file: 'TV on the Radio - Wolf Like Me.mp3', title: 'Wolf Like Me', artist: 'TV on the Radio', cover: 'https://i.postimg.cc/wjH32D9Y/images.jpg' },
      { file: 'NF - HAPPY.mp3', title: 'HAPPY', artist: 'NF', cover: 'https://i.postimg.cc/vTNTZn56/Nf-Happy.jpg' },
      { file: 'Avicii - Fade Into Darkness (Vocal Radio Mix).mp3', title: 'Fade Into Darkness', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg' },
      { file: 'Kygo - Think About You.mp3', title: 'Think About You', artist: 'Kygo', cover: 'https://i.postimg.cc/sXFZmG2z/8cc38ce80cb43e99d974f011f7714c19.jpg' },
      { file: 'MGMT - Kids.mp3', title: 'Kids', artist: 'MGMT', cover: 'https://i.postimg.cc/3wcdxfVc/1900x1900-000000-80-0-0-(1).jpg' },
      { file: 'Kygo - Stargazing.mp3', title: 'Stargazing', artist: 'Kygo', cover: 'https://i.postimg.cc/xC7SZVHk/images-(2).jpg' },
      { file: 'NF - SORRY.mp3', title: 'SORRY', artist: 'NF', cover: 'https://i.postimg.cc/bY5mZH1V/1900x1900-000000-80-0-0.jpg' },
      { file: 'Avicii - I Could Be The One (Avicii Vs. Nicky Romero) (Radio Edit).mp3', title: 'I Could Be The One', artist: 'Avicii Vs. Nicky Romero', cover: 'https://i.postimg.cc/wj89HNvZ/ab67616d0000b273d1f3c40cd2e251e04ae6413f.jpg' },
      { file: 'Kygo - Freeze.mp3', title: 'Freeze', artist: 'Kygo', cover: 'https://i.postimg.cc/htHm0kzP/Kygo.jpg' },
      { file: 'Tiësto - Red Lights.mp3', title: 'Red Lights', artist: 'Tiësto', cover: 'https://i.postimg.cc/KcJgWk3z/ab67616d0000b2734ca8d06b996fb365b62d3d9c.jpg' },
      { file: 'Avicii - The Nights.mp3', title: 'The Nights', artist: 'Avicii', cover: 'https://i.postimg.cc/zvCR7rPN/ab67616d0000b273a26cc58b4d64c2ece3376389.jpg' },
      { file: 'Kygo - Save My Love.mp3', title: 'Save My Love', artist: 'Kygo', cover: 'https://i.postimg.cc/kMt9LD5c/images.jpg' },
      { file: 'Martin Garrix - The Only Way Is Up.mp3', title: 'The Only Way Is Up', artist: 'Martin Garrix', cover: 'https://i.postimg.cc/CxDHBGmM/images-(1).jpg' },
      { file: 'Eminem - Somebody Save Me.mp3', title: 'Somebody Save Me', artist: 'Eminem', cover: 'https://i.postimg.cc/90ntT163/ab67616d0000b273a5f33cd0d7e1223a0fbd865e.jpg' },
      { file: 'Marshmello - Be Kind.mp3', title: 'Be Kind', artist: 'Marshmello', cover: 'https://i.postimg.cc/sDMJydWc/0x1900-000000-80-0-0-(1).jpg' },
      { file: 'Justin Bieber - Ghost.mp3', title: 'Ghost', artist: 'Justin Bieber', cover: 'https://i.postimg.cc/MpdVgzZ5/images.jpg' },
      { file: 'A Flock of Seagulls - I Ran (So Far Away).mp3', title: 'I Ran (So Far Away)', artist: 'A Flock of Seagulls', cover: 'https://i.postimg.cc/cCPhP0d2/0x1900-000000-80-0-0.jpg' },
      { file: 'OneRepublic - Apologize.mp3', title: 'Apologize', artist: 'OneRepublic', cover: 'https://i.postimg.cc/TwbdjPLQ/ab67616d0000b27334ef81d1ff3b4682a4e97f70.jpg' },
      { file: 'Kid Ink - Money and the Power.mp3', title: 'Money and the Power', artist: 'Kid Ink', cover: 'https://i.postimg.cc/BZHhkPrb/8c2004d2635aa15acb1b4e425bc061b9-1000x1000x1.jpg' }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('main-audio');
    const playerCover = document.getElementById('player-cover');
    const discWrapper = document.getElementById('disc-wrapper');
    const songListContainer = document.getElementById('song-list-container');

    function renderPlaylist() {
      songListContainer.innerHTML = '';
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
        item.onclick = () => playSongByIndex(index);

        item.innerHTML = `
          <img src="${song.cover}" alt="${song.title}">
          <div class="song-info">
            <div class="song-name" id="song-name-${index}">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          </div>
          <div class="equalizer">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
          </div>
        `;
        songListContainer.appendChild(item);
      });
    }

    function playSongByIndex(index) {
      currentIndex = index;
      const song = playlist[currentIndex];

      audio.src = song.file;
      audio.load();
      
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {});
      }

      document.getElementById('player-title').textContent = song.title;
      document.getElementById('player-artist').textContent = song.artist;
      playerCover.src = song.cover;

      updateActiveSongClass();
    }

    function updateActiveSongClass() {
      const items = document.querySelectorAll('.song-item');
      items.forEach((item, index) => {
        const songNameEl = document.getElementById(`song-name-${index}`);
        if (index === currentIndex) {
          item.classList.add('active');
          if (!audio.paused) {
            item.classList.add('playing');
            if (songNameEl) {
              songNameEl.style.color = '#ffffff';
              songNameEl.style.textShadow = '0 0 8px rgba(0, 229, 255, 0.5)';
            }
          } else {
            item.classList.remove('playing');
            if (songNameEl) {
              songNameEl.style.color = '#f1f5f9';
              songNameEl.style.textShadow = 'none';
            }
          }
        } else {
          item.classList.remove('active', 'playing');
          if (songNameEl) {
            songNameEl.style.color = '#f1f5f9';
            songNameEl.style.textShadow = 'none';
          }
        }
      });
    }

    /* --- SISTEMA DE ANÁLISIS DE BAJOS (SOLO PARA EL DISCO) --- */
    let audioCtx, analyser, source;

    function initAudioVisualizer() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      updateBassVisuals();
    }

    function updateBassVisuals() {
      if (!audio.paused && analyser) {
        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(dataArray);

        const bassValue = (dataArray[0] + dataArray[1] + dataArray[2] + dataArray[3]) / 4;
        
        const glowSize = Math.floor((bassValue / 255) * 35) + 6;
        const opacity = (bassValue / 255) * 0.8 + 0.2;

        /* Aura dual reactiva únicamente en el disco principal */
        discWrapper.style.boxShadow = `
          -${glowSize}px 0 ${glowSize}px rgba(255, 0, 51, ${opacity}), 
          ${glowSize}px 0 ${glowSize}px rgba(0, 229, 255, ${opacity}),
          inset 0 0 ${glowSize / 2}px rgba(255, 255, 255, ${opacity * 0.3})
        `;
        discWrapper.style.borderColor = `rgba(255, 255, 255, ${opacity * 0.8})`;

        requestAnimationFrame(updateBassVisuals);
      } else {
        discWrapper.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.8)';
        discWrapper.style.borderColor = 'rgba(255, 255, 255, 0.08)';
      }
    }

    audio.addEventListener('play', () => {
      discWrapper.classList.add('rotating');
      updateActiveSongClass();
      try {
        initAudioVisualizer();
      } catch (e) {}
    });

    audio.addEventListener('pause', () => {
      discWrapper.classList.remove('rotating');
      discWrapper.style.boxShadow = '0 10px 25px rgba(0, 0, 0, 0.8)';
      discWrapper.style.borderColor = 'rgba(255, 255, 255, 0.08)';
      updateActiveSongClass();
    });

    audio.addEventListener('ended', () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      playSongByIndex(currentIndex);
    });

    renderPlaylist();

    /* --- SISTEMA DE ESFERAS Y PARTÍCULAS --- */
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.4 + 0.1,
        speedX: (Math.random() - 0.5) * 0.2,
        speedY: (Math.random() - 0.5) * 0.2
      });
    }

    let activeBall = null;

    function spawnDragonBall() {
      const fromLeft = Math.random() > 0.5;
      const speed = Math.random() * 0.3 + 0.4;
      const starsCount = Math.floor(Math.random() * 4) + 1;
      const randomY = Math.random() * 35 + 15;

      activeBall = {
        fromLeft: fromLeft,
        x: fromLeft ? -50 : canvas.width + 50,
        y: randomY,
        speedX: fromLeft ? speed : -speed,
        speedY: 0,
        stars: starsCount,
        radius: 11,
        angle: 0,
        spinSpeed: (Math.random() - 0.5) * 0.02,
        flashTimer: 0
      };
    }

    function scheduleNextDragonBall() {
      setTimeout(() => {
        spawnDragonBall();
      }, 18000);
    }

    setTimeout(spawnDragonBall, 10000);

    function drawStarVector(ctx, x, y, radius) {
      ctx.save();
      ctx.translate(x, y);
      ctx.beginPath();
      const spikes = 5;
      let rot = Math.PI / 2 * 3;
      let step = Math.PI / spikes;

      ctx.moveTo(0, -radius);
      for (let i = 0; i < spikes; i++) {
        let xCoord = Math.cos(rot) * radius;
        let yCoord = Math.sin(rot) * radius;
        ctx.lineTo(xCoord, yCoord);
        rot += step;

        xCoord = Math.cos(rot) * (radius * 0.4);
        yCoord = Math.sin(rot) * (radius * 0.4);
        ctx.lineTo(xCoord, yCoord);
        rot += step;
      }
      ctx.lineTo(0, -radius);
      ctx.closePath();
      ctx.fillStyle = '#e60000';
      ctx.fill();
      ctx.restore();
    }

    function drawDragonBall(ball) {
      ctx.save();
      ctx.translate(ball.x, ball.y);
      ctx.rotate(ball.angle);

      ball.flashTimer += 0.03;
      const pulse = Math.sin(ball.flashTimer);
      const glowAlpha = pulse > 0.7 ? (pulse - 0.7) * 1.5 : 0.05;

      if (glowAlpha > 0.05) {
        const glowGradient = ctx.createRadialGradient(0, 0, 2, 0, 0, ball.radius * 2.2);
        glowGradient.addColorStop(0, `rgba(255, 200, 50, ${glowAlpha})`);
        glowGradient.addColorStop(1, 'rgba(255, 120, 0, 0)');
        ctx.fillStyle = glowGradient;
        ctx.beginPath();
        ctx.arc(0, 0, ball.radius * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      const ballGradient = ctx.createRadialGradient(-2, -2, 1, 0, 0, ball.radius);
      ballGradient.addColorStop(0, 'rgba(255, 230, 120, 0.98)');
      ballGradient.addColorStop(0.5, 'rgba(255, 150, 20, 0.92)');
      ballGradient.addColorStop(1, 'rgba(200, 70, 0, 0.95)');

      ctx.beginPath();
      ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = ballGradient;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 240, 200, 0.5)';
      ctx.lineWidth = 1;
      ctx.stroke();

      drawRedStarsVector(ctx, ball.stars, ball.radius * 0.5);

      ctx.restore();
    }

    function drawRedStarsVector(ctx, count, R) {
      const starSize = R * 0.42;
      if (count === 1) {
        drawStarVector(ctx, 0, 0, starSize);
      } else if (count === 2) {
        drawStarVector(ctx, -R * 0.35, 0, starSize);
        drawStarVector(ctx, R * 0.35, 0, starSize);
      } else if (count === 3) {
        drawStarVector(ctx, 0, -R * 0.3, starSize);
        drawStarVector(ctx, -R * 0.4, R * 0.35, starSize);
        drawStarVector(ctx, R * 0.4, R * 0.35, starSize);
      } else if (count === 4) {
        drawStarVector(ctx, -R * 0.35, -R * 0.35, starSize);
        drawStarVector(ctx, R * 0.35, -R * 0.35, starSize);
        drawStarVector(ctx, -R * 0.35, R * 0.35, starSize);
        drawStarVector(ctx, R * 0.35, R * 0.35, starSize);
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      particles.forEach(p => {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
        ctx.fill();
      });

      if (activeBall) {
        activeBall.x += activeBall.speedX;
        activeBall.y += activeBall.speedY;
        activeBall.angle += activeBall.spinSpeed;

        drawDragonBall(activeBall);

        const isOut = activeBall.fromLeft 
          ? (activeBall.x > canvas.width + 60)
          : (activeBall.x < -60);

        if (isOut) {
          activeBall = null;
          scheduleNextDragonBall();
        }
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
